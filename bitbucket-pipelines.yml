            - chmod 600 ~/.ssh/id_rsa
            - echo $SSH_PRIVATE_KEY
            - ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
            - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SERVER_USER@$SERVER_IP echo "Starting Deployment"
            - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SERVER_USER@$SERVER_IP "cd ~/myproject && git checkout development"
            - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SERVER_USER@$SERVER_IP "cd ~/myproject && git pull"
            - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SERVER_USER@$SERVER_IP "cd ~/myproject && make rebuild"
            - ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa $SERVER_USER@$SERVER_IP "docker system prune -a --volumes -f"
            - echo "Deployment finished successfully!"

    production:
      - step:
          name: Production
          size: 2x
          deployment: Production
          script:
            - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP echo "Starting Deployment"
            - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd ~/getirnow-frontend && git checkout production"
            - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd ~/getirnow-frontend && git pull"
            - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd ~/getirnow-frontend && make rebuild"
            - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker system prune -a --volumes -f"
            - echo "Deployment finished successfully!"
