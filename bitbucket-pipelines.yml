image: atlassian/default-image:latest

options:
  runtime:
    cloud:
      atlassian-ip-ranges: true

pipelines:
  branches:
    development:
      - step:
          name: Dev Development
          size: 2x
          deployment: Development
          script:
            - mkdir -p ~/.ssh
            - ssh-keyscan $SERVER_IP >> ~/.ssh/known_hosts
            - cat /opt/atlassian/pipelines/agent/ssh/id_rsa > ~/.ssh/temp_id_rsa
            - chmod 600 ~/.ssh/temp_id_rsa
            - ssh -i ~/.ssh/temp_id_rsa -o StrictHostKeyChecking=no ubuntu@$SERVER_IP "echo ✅ Connected!"
            - ssh -i /opt/atlassian/pipelines/agent/ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd ~/myproject && git checkout development"
            - ssh -i /opt/atlassian/pipelines/agent/ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd ~/myproject && git pull"
            - ssh -i /opt/atlassian/pipelines/agent/ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd ~/myproject && sudo make rebuild"
            - ssh -i /opt/atlassian/pipelines/agent/ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker system prune -a --volumes -f"
            - echo "Deployment finished successfully!"

    production:
      - step:
          name: Production
          size: 2x
          deployment: Production
          script:
            - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP echo "Starting Deployment"
            - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd ~/getirnow-frontend && git checkout production"
            - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd ~/getirnow-frontend && git pull"
            - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "cd ~/getirnow-frontend && make rebuild"
            - ssh -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "docker system prune -a --volumes -f"
            - echo "Deployment finished successfully!"
