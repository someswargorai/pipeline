image: atlassian/default-image:latest

options:
  runtime:
    cloud:
      atlassian-ip-ranges: true

pipelines:
  branches:
    development:
      - step:
          name: Dev Deployment
          size: 2x
          deployment: Development
          script:
            - echo -e $PRIVATE_KEY > key.pem
            - chmod 600 key.pem
            - cat key.pem  # Debug: Verify key file contents
            - ssh -v -i key.pem -o StrictHostKeyChecking=no ubuntu@ec2-52-91-162-18.compute-1.amazonaws.com "echo 'Connected to Dev'"
            - ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@ec2-52-91-162-18.compute-1.amazonaws.com "
                cd ~/myproject &&
                git checkout development &&
                git pull &&
                sudo make rebuild &&
                docker system prune -a --volumes -f
              "
            - echo "✅ Dev Deployment finished!"

    production:
      - step:
          name: Production Deployment
          size: 2x
          deployment: Production
          script:
            - echo -e "$PRIVATE_KEY" > key.pem
            - chmod 600 key.pem
            - cat key.pem  # Debug: Verify key file contents
            - ssh -v -i key.pem -o StrictHostKeyChecking=no ubuntu@ec2-52-91-162-18.compute-1.amazonaws.com "echo 'Connected to Prod'"
            - ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@ec2-52-91-162-18.compute-1.amazonaws.com "
                cd ~/getirnow-frontend &&
                git checkout production &&
                git pull &&
                make rebuild &&
                docker system prune -a --volumes -f
              "
            - echo "✅ Production Deployment finished!"