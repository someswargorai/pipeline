image: atlassian/default-image:latest

options:
  runtime:
    cloud:
      atlassian-ip-ranges: true

pipelines:
  branches:
    development:
      - step:
          name: Dev Deployment
          size: 2x
          deployment: Development
          script:
            - mkdir -p ~/.ssh
            - echo "$PRIVATE_KEY" > ~/.ssh/key.pem
            - chmod 600 ~/.ssh/key.pem
            - cat ~/.ssh/key.pem
            - ssh -v -i ~/.ssh/key.pem -o StrictHostKeyChecking=no ubuntu@ec2-52-91-162-18.compute-1.amazonaws.com "echo 'Connected to Dev'"
            - ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no ubuntu@ec2-52-91-162-18.compute-1.amazonaws.com "cd ~/getirnow-frontend && git checkout production"
            - ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no ubuntu@ec2-52-91-162-18.compute-1.amazonaws.com "cd ~/getirnow-frontend && git pull"
            - ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no ubuntu@ec2-52-91-162-18.compute-1.amazonaws.com "cd ~/getirnow-frontend && make rebuild"
            - ssh -i ~/.ssh/key.pem -o StrictHostKeyChecking=no ubuntu@ec2-52-91-162-18.compute-1.amazonaws.com "docker system prune -a --volumes -f"
            - echo "✅ Dev Deployment finished!"

    production:
      - step:
          name: Production Deployment
          size: 2x
          deployment: Production
          script:
            - echo -e "-----BEGIN OPENSSH PRIVATE KEY-----\n\
              \n\
              -----END OPENSSH PRIVATE KEY-----" > key.pem
            - chmod 600 key.pem
            - cat key.pem  # Debug: Verify key file contents
            - ssh -v -i key.pem -o StrictHostKeyChecking=no ubuntu@ec2-52-91-162-18.compute-1.amazonaws.com "echo 'Connected to Prod'"
            - ssh -i key.pem -o StrictHostKeyChecking=no ubuntu@ec2-52-91-162-18.compute-1.amazonaws.com "
                cd ~/getirnow-frontend &&
                git checkout production &&
                git pull &&
                make rebuild &&
                docker system prune -a --volumes -f
              "
            - echo "✅ Production Deployment finished!"