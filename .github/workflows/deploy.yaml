name: EC2 Deployment and Scheduled Cleanup

on:
  push:
    branches:
      - development
      - production

  schedule:
    - cron: '0 0 * * *' # every day at 12 AM

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up SSH access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Run deployment on EC2
        env:
          SERVER_IPS: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "Starting Deployment"

          if [[ "${GITHUB_REF}" == "refs/heads/development" ]]; then
            echo "$SERVER_IPS" > ips.json
            for ip in $(jq -r '.[]' ips.json); do
              echo "Deploying to $ip (development)..."
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$ip "
                cd ~/myproject &&
                git checkout development &&
                git pull origin development &&
                make rebuild
              "
            done
          elif [[ "${GITHUB_REF}" == "refs/heads/production" ]]; then
            echo "$SERVER_IPS" > ips.json
            for ip in $(jq -r '.[]' ips.json); do
              echo "Deploying to $ip (production)..."
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$ip "
                cd ~/getirnow-frontend &&
                git checkout production &&
                git pull &&
                make rebuild
              "
            done
          fi

      - name: Done
        run: echo "✅ Deployment finished successfully!"

  cleanup:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up SSH access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Run safe Docker cleanup on EC2
        env:
          SERVER_IPS: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$SERVER_IPS" > ips.json
          for ip in $(jq -r '.[]' ips.json); do
            echo "🧹 Running cleanup on $ip"
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$ip "
              docker system df &&
              docker container prune -f &&
              docker image prune -f &&
              docker volume prune -f &&
              docker system df
            "
          done
