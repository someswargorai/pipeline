name: EC2 Deployment and Scheduled Cleanup

on:
  push:
    branches:
      - development
      - production

  schedule:
    - cron: '0 0 * * *' # every day at 12 AM

jobs:
  deploy:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up SSH access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Run deployment on EC2 with rollback
        env:
          SERVER_IPS: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "Starting Deployment"
          echo "$SERVER_IPS" > ips.json

          for ip in $(jq -r '.[]' ips.json); do
            echo "Deploying to $ip..."

            if [[ "${GITHUB_REF}" == "refs/heads/development" ]]; then
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$ip '
                set -e
                cd ~/myproject
                ROLLBACK_COMMIT=$(cat .last-good-commit)
                git checkout development
                git pull origin development
                make rebuild

                echo "🩺 Running health check..."
                if curl -sSf http://localhost:3000/; then
                  echo "✅ Health check passed."
                  git rev-parse HEAD > .last-good-commit
                else
                  echo "❌ Health check failed! Rolling back..."
                  git reset --hard $ROLLBACK_COMMIT
                  make rebuild
                fi
              '
            elif [[ "${GITHUB_REF}" == "refs/heads/production" ]]; then
              ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$ip '
                set -e
                cd ~/myproject
                PREV_COMMIT=$(git rev-parse HEAD)
                git checkout production
                git pull origin production
                make rebuild

                echo "🩺 Running health check..."
                if curl -sSf http://localhost:3000/; then
                  echo "✅ Health check passed."
                else
                  echo "❌ Health check failed! Rolling back..."
                  git reset --hard $PREV_COMMIT
                  make rebuild
                fi
              '
            fi
          done

      - name: Done
        run: echo "✅ Deployment finished successfully!"

  cleanup:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest

    steps:
      - name: Install jq
        run: sudo apt-get update && sudo apt-get install -y jq

      - name: Set up SSH access
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

      - name: Run safe Docker cleanup on EC2
        env:
          SERVER_IPS: ${{ secrets.SERVER_IP }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          echo "$SERVER_IPS" > ips.json
          for ip in $(jq -r '.[]' ips.json); do
            echo "🧹 Running cleanup on $ip"
            ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$ip '
              docker system df &&
              docker container prune -f &&
              docker image prune -f &&
              docker volume prune -f &&
              docker system df
            '
          done
